{% extends 'layout.html' %}

{% block content %}
<div class="container my-5">
    <!-- Tarjeta Principal del Formulario -->
    <div class="card shadow-sm border-0 mx-auto" style="max-width: 700px;">
        <!-- Encabezado de la Tarjeta (Color verde temático para productos/éxito) -->
        <div class="card-header bg-dark text-white p-3 border-0 rounded-top">
            <h4 class="mb-0 fw-bold"><i class="bi bi-box-seam-fill text-success"></i> Registrar Nuevo Producto</h4>
        </div>
        
        <!-- Cuerpo del Formulario -->
        <div class="card-body p-4 text-dark">
            <p class="text-muted small mb-4">Ingrese las especificaciones, precios y existencias para añadir el artículo al inventario.</p>
            
            <form action="/product/new" method="POST">
                
                <!-- Fila 1: Nombre del Producto -->
                <div class="mb-3">
                    <label for="nombre_producto" class="form-label fw-semibold">Nombre del Producto <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-tag"></i></span>
                        <input type="text" class="form-control" id="nombre_producto" name="nombre_producto" placeholder="Ej. Papel Impresión Resma A4" required>
                    </div>
                </div>

                <!-- Fila 2: Código de Barras / SKU y Categoría en paralelo -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="barcode" class="form-label fw-semibold">Código de Barras / SKU</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-barcode"></i></span>
                            <input type="text" class="form-control" id="barcode" name="barcode" placeholder="Ej. 770123456789">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label for="categoria" class="form-label fw-semibold">Categoría <span class="text-danger">*</span></label>
                        <select class="form-select" id="categoria" name="categoria" required>
                            <option value="" selected disabled>Seleccione...</option>
                            <option value="tecnologia">Tecnología / Electrónica</option>
                            <option value="papeleria">Papelería / Oficina</option>
                            <option value="aseo">Aseo / Cafetería</option>
                            <!-- Flask cargará esto dinámicamente más adelante -->
                        </select>
                    </div>
                </div>

                <!-- Fila 3: Precio de Venta y Stock Inicial en paralelo -->
                <div class="row mb-4">
                    <div class="col-md-6">
                        <label for="precio" class="form-label fw-semibold">Precio de Venta (COP) <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-currency-dollar"></i></span>
                            <input type="number" step="0.01" class="form-control" id="precio" name="precio" placeholder="Ej. 15000" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label for="stock" class="form-label fw-semibold">Stock / Cantidad Inicial <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-hash"></i></span>
                            <input type="number" class="form-control" id="stock" name="stock" placeholder="Ej. 50" required>
                        </div>
                    </div>
                </div>

                <!-- Botones de Acción -->
                <div class="d-flex justify-content-end gap-2 border-top pt-3">
                    <a href="/" class="btn btn-outline-secondary px-4">Cancelar</a>
                    <button type="submit" class="btn btn-success px-4 fw-bold shadow-sm">Guardar Producto</button>
                </div>

            </form>
        </div>
    </div>
</div>
{% endblock %}
