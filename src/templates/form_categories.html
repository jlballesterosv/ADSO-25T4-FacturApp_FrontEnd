{% extends 'layout.html' %}

{% block content %}
<div class="container my-5">
    <!-- Tarjeta Principal del Formulario -->
    <div class="card shadow-sm border-0 mx-auto" style="max-width: 700px;">
        <!-- Encabezado de la Tarjeta (Color temático amarillo/información para administración de categorías) -->
        <div class="card-header bg-dark text-white p-3 border-0 rounded-top">
            <h4 class="mb-0 fw-bold"><i class="bi bi-bookmark-plus text-warning"></i> Registrar Nueva Categoría</h4>
        </div>
        
        <!-- Cuerpo del Formulario -->
        <div class="card-body p-4 text-dark">
            <p class="text-muted small mb-4">Defina los parámetros para agrupar y organizar sus productos en el inventario.</p>
            
            <form action="/category/new" method="POST">
                
                <!-- Fila 1: Nombre de la Categoría y Código en paralelo -->
                <div class="row mb-3">
                    <div class="col-md-8">
                        <label for="nombre_categoria" class="form-label fw-semibold">Nombre de la Categoría <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-bookmarks"></i></span>
                            <input type="text" class="form-control" id="nombre_categoria" name="nombre_categoria" placeholder="Ej. Alimentos y Bebidas" required>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <label for="codigo_categoria" class="form-label fw-semibold">Código / Sigla <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-hash"></i></span>
                            <input type="text" class="form-control" id="codigo_categoria" name="codigo_categoria" placeholder="Ej. ALM" required>
                        </div>
                    </div>
                </div>

                <!-- Fila 2: Descripción de la Categoría -->
                <div class="mb-4">
                    <label for="descripcion_categoria" class="form-label fw-semibold">Descripción</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-justify-left"></i></span>
                        <textarea class="form-control" id="descripcion_categoria" name="descripcion_categoria" rows="3" placeholder="Breve descripción del tipo de productos que pertenecerán a esta categoría..."></textarea>
                    </div>
                </div>

                <!-- Botones de Acción -->
                <div class="d-flex justify-content-end gap-2 border-top pt-3">
                    <a href="/" class="btn btn-outline-secondary px-4">Cancelar</a>
                    <button type="submit" class="btn btn-warning text-dark px-4 fw-bold shadow-sm">Crear Categoría</button>
                </div>

            </form>
        </div>
    </div>
</div>
{% endblock %}
